<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfoliobot</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/weberi/chatroom@master/dist/Chatroom.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/weberi/chatroom@master/index.css" />

  <style>
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #e9ecef;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Layout --- */
    .app-wrapper {
      position: relative;
    }

    /* --- Schalter Design --- */
    .toggle-wrapper {
      position: absolute;
      bottom: 30px; /* unter dem Chat */
      left: 0;       /* linksbündig */
      display: flex;
      align-items: center;
      gap: 10px;
      color: #000000;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 1000;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4facfe; /* Farbe wenn aktiviert */
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* --- Clippy --- */
    .clippy-container {
      position: absolute;
      left: -110px; 
      top: 50%;
      transform: translateY(-50%) scale(1);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease; 
    }

    .clippy-hidden {
      opacity: 0;
      transform: translateY(-50%) scale(0.8); 
    }

    #clippy-svg {
      display: block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .chat-container {
      width: 420px;
      max-width: 95vw;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <div class="toggle-wrapper">
      <label class="switch">
        <input type="checkbox" id="clippy-toggle" checked>
        <span class="slider"></span>
      </label>
      <span>Clippy anzeigen</span>
    </div>

    <div class="clippy-container" id="clippy-container">
      <svg id="clippy-svg" width="80" height="100" viewBox="0 0 50 60">
        <path d="M 35 15 L 35 45 A 10 10 0 0 1 15 45 L 15 20 A 7 7 0 0 1 29 20 L 29 40 A 3 3 0 0 1 23 40 L 23 25" 
              fill="none" stroke="#4a4e69" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="20" cy="18" rx="7" ry="9" fill="white" stroke="#4a4e69" stroke-width="2"/>
        <ellipse cx="34" cy="18" rx="7" ry="9" fill="white" stroke="#4a4e69" stroke-width="2"/>
        <circle id="pupil-left" cx="20" cy="18" r="3" fill="#22223b"/>
        <circle id="pupil-right" cx="34" cy="18" r="3" fill="#22223b"/>
      </svg>
    </div>

    <div class="chat-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/weberi/chatroom@master/dist/Chatroom.js"></script>

  <script>
    if (!window.Chatroom) {
      document.body.insertAdjacentHTML('beforeend',
        '<div style="padding:12px;color:#fff;background:#c00">Could not load Chatroom.js</div>');
    }

    var chatroom = new window.Chatroom({
      host: "https://glorious-goggles-jr5565ggx5vjhp6qr-5005.app.github.dev",
      title: "🤖 Portfoliobot", 
      container: document.querySelector(".chat-container"),
      welcomeMessage: "Hallo! Ich kann das Wetter checken, Infos suchen, Witze erzählen oder Tank-Kosten vergleichen. Was hast du vor?",
      speechRecognition: "de-DE"
    });
    chatroom.openChat();

    // --- Logik für den Clippy-Schalter ---
    const clippyToggle = document.getElementById('clippy-toggle');
    const clippyContainer = document.getElementById('clippy-container');

    clippyToggle.addEventListener('change', function() {
      if (this.checked) {
        clippyContainer.classList.remove('clippy-hidden');
      } else {
        clippyContainer.classList.add('clippy-hidden');
      }
    });

    // --- Augen-Animation für Clippy ---
    document.addEventListener('mousemove', function(e) {
      if (!clippyToggle.checked) return;

      const pupilL = document.getElementById('pupil-left');
      const pupilR = document.getElementById('pupil-right');
      const svg = document.getElementById('clippy-svg');
      
      if (!pupilL || !pupilR || !svg) return;

      const rect = svg.getBoundingClientRect();
      const clippyCenterX = rect.left + (rect.width / 2);
      const clippyCenterY = rect.top + (rect.height / 2);

      const deltaX = e.clientX - clippyCenterX;
      const deltaY = e.clientY - clippyCenterY;

      const angle = Math.atan2(deltaY, deltaX);
      const distance = Math.min(4, Math.hypot(deltaX, deltaY) / 40);

      const xOffset = Math.cos(angle) * distance;
      const yOffset = Math.sin(angle) * distance;

      pupilL.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      pupilR.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
    });
  </script>
</body>
</html>
